version: '1'
max_parallel: 4
# M8: per-run spawn budget (DeerFlow max_total_per_run parity, default 6).
max_per_run: 6
# Real tool steps a child run may take before it stops (`termination: max_steps`).
# This is the step cap ONLY; the spawn/subjob/MCP/HTTP call paths that used to
# default to a literal 4 read this row. 4 cut a research child off before its
# final-answer turn (2026-11-07 SJ1.1: `steps: 5, max_steps: 4`), so the shipped
# value leaves room for connect -> search -> filter -> compose -> answer.
max_steps: 8
# I-1: a role may carry `tools`, the ONLY thing that limits what its agent can
# call. Exact names ("fs.read") or a whole namespace ("fs" = every fs.* tool).
# NO `tools` key = unrestricted (the pre-I-1 behaviour), so a role that was never
# scoped keeps working exactly as before.
roles:
  researcher:
    brief: 'Investigate a question against primary sources. Return a compact, cited
      summary (max ~400 words) with inline [title](url) citations on every claim plus
      a link-only Sources section. Do NOT modify files.

      '
    # read-only: no writer, no shell, no memory/skill mutation.
    tools:
    - fs.read
    - glob
    - grep.search
    - diff
    - index
    - knowledge
    - chapters
    - skills
    - web
    - http
    - git
    - context
    - self.info
    - self.tools
    - sessions.list
    - sessions.read
  coder:
    brief: 'Implement a small, self-contained code change. Report the exact files
      touched and the commands you ran. Do NOT touch unrelated files.

      '
  reviewer:
    brief: 'Audit the given code or output for correctness and risks. Return a short,
      prioritised findings list with file/line references. Do NOT modify files.

      '
    tools:
    - fs.read
    - glob
    - grep.search
    - diff
    - index
    - knowledge
    - chapters
    - skills
    - web
    - http
    - git
    - context
    - self.info
    - self.tools
    - sessions.list
    - sessions.read
  # RH-24: written by the Subagents ✨ (AI draft) and kept — the store form the panel
  # uses for a role without a tool scope.
  editor: Draft or revise prose documents — READMEs, changelogs, announcements, documentation.
    Preserve the author's meaning while tightening structure, tone, and clarity for
    the stated audience. Return the full revised text plus a brief note on what changed.
    Do NOT touch code files.
