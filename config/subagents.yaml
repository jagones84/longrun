version: '1'
max_parallel: 4
# M8: per-run spawn budget (DeerFlow max_total_per_run parity, default 6).
max_per_run: 6
# I-1: a role may carry `tools`, the ONLY thing that limits what its agent can
# call. Exact names ("fs.read") or a whole namespace ("fs" = every fs.* tool).
# NO `tools` key = unrestricted (the pre-I-1 behaviour), so a role that was never
# scoped keeps working exactly as before.
roles:
  researcher:
    brief: 'Investigate a question against primary sources. Return a compact, cited
      summary (max ~400 words) with inline [title](url) citations on every claim
      plus a link-only Sources section. Do NOT modify files.

      '
    # read-only: no writer, no shell, no memory/skill mutation.
    tools:
      - fs.read
      - glob
      - grep.search
      - diff
      - index
      - knowledge
      - chapters
      - skills
      - web
      - http
      - git
      - context
      - self.info
      - self.tools
      - sessions.list
      - sessions.read
  coder:
    brief: 'Implement a small, self-contained code change. Report the exact files
      touched and the commands you ran. Do NOT touch unrelated files.

      '
  reviewer:
    brief: 'Audit the given code or output for correctness and risks. Return a short,
      prioritised findings list with file/line references. Do NOT modify files.

      '
    tools:
      - fs.read
      - glob
      - grep.search
      - diff
      - index
      - knowledge
      - chapters
      - skills
      - web
      - http
      - git
      - context
      - self.info
      - self.tools
      - sessions.list
      - sessions.read
