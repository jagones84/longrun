# ─────────────────────────────────────────────────────────────────────────────
# COST LOCK (v1316) — SHIPPED OFF (2026-11-27)
#
# The operator chooses the models in `roles` below; there is NO restriction by
# default. This key is the optional safety valve: leave it empty (`[]`) to allow
# everything, or list `provider:model` refs to refuse spending on anything else.
# When non-empty it is enforced in `model/routing.py` (selection: role_model /
# pick / model_chain / turn_model) and in `server.stream_with_fallback`
# (dispatch): a PAID ref outside the list is never called — the turn runs on the
# default instead. A LOCAL provider and an unresolved llama.cpp alias are never
# blocked (they cannot cost anything).
#
#   deepseek:deepseek-flash            — DeepSeek direct, the cheap workhorse
#   openrouter:z-ai/glm-5.3-flash      — OpenRouter GLM flash, the other tier
#
# Empty = the router roles are the only decision (the pre-v1316 behaviour).
allowed_models: []

roles:
  chat:
    model: deepseek:deepseek-flash
    fallbacks:
    - openrouter:z-ai/glm-5.3-flash
  agent:
    model: deepseek:deepseek-flash
    fallbacks:
    - openrouter:z-ai/glm-5.3-flash
  subagent:
    model: deepseek:deepseek-flash
    fallbacks:
    - openrouter:z-ai/glm-5.3-flash
  summarizer:
    model: openrouter:z-ai/glm-5.3-flash
    fallbacks:
    - deepseek:deepseek-flash
  team_lead:
    model: openrouter:z-ai/glm-5.3-flash
    fallbacks:
    - deepseek:deepseek-flash
  team_member:
    model: deepseek:deepseek-flash
    fallbacks:
    - openrouter:z-ai/glm-5.3-flash
  architect:
    model: deepseek:deepseek-flash
    fallbacks:
    - openrouter:z-ai/glm-5.3-flash
  # K-2 (2026-11-02): the model that drafts the text of a WebUI field when the ✨
  # control is clicked. A SESSION-SCOPED surface ignores this role and runs on the
  # session's own model instead; this entry backs every other surface, and it is the
  # single knob the operator routes in Settings ▸ Models.
  generate:
    model: openrouter:z-ai/glm-5.3-flash
    fallbacks:
    - deepseek:deepseek-flash
  # E-1 (2026-11-04): the SELF-IMPROVEMENT reviewer must not be the model that
  # produced the artifact — `improve.review` and the self-evolve abstraction both
  # call `single_shot(role="reviewer")`. Before this role existed the call fell
  # through to `default_model()`, i.e. the producer, so every "review" was the
  # producing model agreeing with itself. v796 fails if this matches any producing
  # role (chat/agent/subagent/architect — all `deepseek-flash` here) or the
  # providers default (`deepseek:deepseek-flash`).
  reviewer:
    model: openrouter:z-ai/glm-5.3-flash
    fallbacks:
    - deepseek:deepseek-flash
  # Round 77 (2026-11-18): the post-session local optimizer (evolve/optimizer.py)
  # is a BACKGROUND proposer, not a user-facing turn: it reads one session trace
  # and writes at most one registry proposal, which the operator still approves.
  # v1316: it used `deepseek-chat`, which DeepSeek retired (see v355). It runs on
  # the authorized GLM tier — the OTHER tier from the chat/agent default, so a
  # proposal is never written by the same model that produced the session.
  optimizer:
    model: openrouter:z-ai/glm-5.3-flash
    fallbacks:
    - deepseek:deepseek-flash
default_fallbacks: []
# I-2: remember a 429 (quota) per model for `retry_not_before_s` and put that
# model LAST in the candidate chain until the window expires. Process-local, no
# state on disk; a single-model chain still returns its model (no dead end).
quota_cooldown: true
