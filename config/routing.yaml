# Longrun role->model routing. JAG-455: there is NO `planner` role — the planner
# call always runs on the SAME model as the session's chat (routing.turn_model),
# so a session pinned to a cloud model can never light up the LOCAL weights.
roles:
  chat:
    pattern: qwen
    fallbacks: []
  agent:
    pattern: qwen
    fallbacks: []
  subagent:
    pattern: glm
    fallbacks:
    - deepseek:deepseek-reasoner
    model: openrouter:meta/muse-spark-1.3-contributor
  summarizer:
    pattern: glm
    fallbacks: []
    model: openrouter:deepseek/deepseek-v4-flash-0731
default_fallbacks: []
