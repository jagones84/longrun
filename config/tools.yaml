# Longrun tool registry — v0.2
# Declarative allowlist + approval policy. Edit and POST /api/tools to reload
# (or just restart the server). Unknown tools are denied; destructive subtools
# override namespace defaults in normal mode. Global approvals.mode=full is an
# explicit opt-out that bypasses per-tool approval gates.
version: "0.2"

# ---- real sandbox (bubblewrap / nsjail / container) --------------------------
sandbox:
  # auto | docker | bwrap | nsjail | none
  #   auto  -> first working backend of: docker, bwrap, nsjail
  #   none  -> run on the host (NOT sandboxed; marked `sandboxed: false`)
  #
  # JAG-59: "tutto deve vivere sul DGX" — the shell tool must use the real DGX
  # environment (JDK/Gradle/Android SDK/adb + the repo), which an alpine
  # container cannot provide. So we run on the host. Mutating commands are
  # still approval-gated and checked against the `deny` list below.
  backend: none
  image: alpine:latest          # container image for the docker backend
  timeout_secs: 900             # per-command wall clock (APK builds take minutes)
  network: true                 # host network (docker backend would use --network host)
  memory_mb: 256
  pids_limit: 128
  cpus: "1.0"
  workspace: sandbox            # per-run scratch dir bind-mounted as /work,
                                # RELATIVE to the data home (never the checkout)

# ---- approvals ---------------------------------------------------------------
approvals:
  timeout_secs: 300             # how long a run waits for a human decision
  # JAG-510 — DANGEROUS, leave it false. When true it unlocks writes into the
  # immutable Nucleus (`src/longrun/`, `webui/`, `config/`, `deploy/`, `tests/`,
  # `docs/`, project state (the data home's `projects/`), `Global_rules.md` / `Project_rules.md`, `AGENTS.md`, ...) for EVERY tool: the shell
  # write-target gate, `fs.write`/`fs.edit` and the tamper-restore all stand down,
  # so the agent can rewrite the harness mid-run. It is the only kill-switch for
  # the Nucleus and it is enabled exclusively from the checkbox marked DANGEROUS
  # in Settings > Tools & approvals — never by `approvals.mode: full`.
  allow_nucleus_write: false
  # JAG-451: approval policy BY CATEGORY — everything the harness can emit on its
  # own. auto = apply/run without asking (still recorded in the audit ledger);
  # required = raise an approval request (you decide); denied = never emitted.
  # Editable in Settings > Tools & approvals.
  kinds:
    memory: auto        # distilled lessons auto-written to data/memory
    proposals: required # agent-proposed rule/skill changes
    skills: required    # self-generated skill drafts (mined -> promoted)
    subagent: auto      # spawning a delegated subagent

# ---- runtime / long-horizon (JAG-129) ---------------------------------------
# Controlla il loop di completamento: l'harness non lascia chiudere il turno
# finche' la TASK LIST ha passi aperti. Editabile anche dalla WebUI (Config).
runtime:
  keepgoing_max: 8          # giri di continuazione prima dello stop 'budget'
  no_progress_rounds: 2     # giri senza progresso prima dello stop 'no_progress'
  max_wall_secs: 3600       # tetto di tempo per run
  subagent_max_depth: 2     # profondita' massima della matrioska
  # JAG-533: how many TOOL calls of one `batch` action the agent may run at the
  # same time (0 or negative = 1). The `batch` action lets the model issue
  # several INDEPENDENT calls in one turn instead of one per turn. The matching
  # cap for parallel SUBAGENTS is `max_parallel` in config/subagents.yaml.
  max_parallel_tools: 4
  # JAG-450 / P2: how many seconds a `dispatch` waits for the teammate's turn
  # before it stops waiting and reports "still running" (the teammate keeps
  # running in its own session). A teammate turn is its OWN chain of model calls
  # + tools + approvals, so a short bound made an orchestrator give up before its
  # report answered (live 2026-11-03: session A54's dispatch to A49 returned
  # "still working" at 300s while A49 was still going). 3600 = one hour.
  # `LONGRUN_DISPATCH_WAIT` still overrides it (tests / one-off run); 30 is the floor.
  dispatch_wait_secs: 3600
  # I-1: how many unexecutable replies in a row the harness RETRIES before it
  # switches strategy (one bounded self-check round, then plain prose) instead of
  # ending the turn. It is a safety valve, not a stop: the goal stays open and
  # resumable and the plan budget bounds a model that never complies. Values below
  # 1 floor at 1. `LONGRUN_INVALID_REPLY_CAP` still overrides it (tests).
  invalid_reply_cap: 4
  # I-2: how many times the harness may inject the SAME (kind, text) into ONE turn.
  # A byte-identical repeat tells the model nothing it does not already have, so
  # this bounds the harness's own bookkeeping (measured 2026-11-01: 189 harness
  # turns, 151 kB of injections in a single session) WITHOUT hiding anything the
  # harness wanted to say: every different text, every different kind and every
  # tool `observation` still reaches the model. A suppressed repeat still shows on
  # the feed with `repeat: true`. 0 or negative disables the bound.
  inject_identical_cap: 1

# ---- context limits (2026-11-05) --------------------------------------------
# EVERY budget that decides how much of the harness's own text reaches the model
# lives here — the operator ruled that no such number may be a literal in Python.
# The same resolution chain as `runtime`: an explicit override -> a LONGRUN_* env
# var (tests / one-off run) -> this block -> the DEFAULTS in
# `model/context_limits.py`. Consumers read it at import, so an edit needs the
# usual service restart (Settings ▸ Harness shows the whole block).
context:
  # One tool observation is pasted VERBATIM up to this many chars; above it the
  # full text goes to data/offload/<session>/ and the model receives a reference
  # (size, path, head+tail preview) it can fs.read in full.
  tool_obs_limit: 6000
  # Ceiling the chat path renders at all before the offload/reference decision.
  render_max: 200000
  # The head+tail preview shown for an offloaded observation.
  offload_head: 1500
  offload_tail: 600
  # Per-turn reference copy of the standing rules / the session's ROLE.md (both
  # are ALSO in the system prompt in full — this is the copy that survives
  # compaction, so it is capped).
  reference_max_chars: 4000
  reference_role_max_chars: 1200
  # Skills index and memory index lines inside the system prompt.
  skills_prompt_max_chars: 2600
  memory_prompt_max_chars: 1200
  memory_item_chars: 120
  # System-prompt rules block (global + project + AGENTS.md).
  rules_prompt_max_bytes: 32768
  # A shell command's captured stdout returned to the agent (hard cut).
  shell_capture_max: 200000
  # fs.read returns this many bytes when the model does not pass `max_bytes`;
  # a line range (start_line/end_line) scans up to 4 MiB of the file.
  fs_read_max_bytes: 65536
  # Bytes pulled back from one sandboxed stream (gigabyte spew guard).
  sandbox_max_output_bytes: 2097152
  # Acceptance predicates (automation checks) and how many of the "missing"
  # ones the model is shown, with how much of each.
  acceptance_max_predicates: 20
  acceptance_max_predicate_len: 200
  acceptance_missing_items: 6
  acceptance_missing_chars: 300
  # A chat turn's real tool calls, its total model iterations, and the narrower
  # budget of a PLAN-ONLY turn; plus how long a delegated subagent is awaited.
  chat_tool_steps: 8
  chat_tool_iters: 64
  plan_tool_steps: 3
  subagent_wait_secs: 180

# ---- limits (2026-11-05) ----------------------------------------------------
# Every value that used to be `int(os.environ.get("LONGRUN_…", <literal>))` in
# `src/`. None of them is a literal in Python any more; the LONGRUN_* env var
# still overrides a row (tests / one-off runs) and the DEFAULTS in
# `model/context_limits.py` are only the fallback for a broken config file.
# Settings ▸ Harness shows the block. Restart after editing (read at import).
limits:
  # --- router / LLM I/O -------------------------------------------------------
  router_retries: 5               # how many times one completion is retried
  router_backoff: 0.75            # first backoff, seconds
  router_backoff_max: 8.0         # backoff ceiling, seconds
  model_load_timeout_secs: 900    # how long a cold model load may take
  router_idle_timeout_secs: 120.0 # max silence tolerated mid-stream
  connect_timeout_secs: 3.0       # TCP connect timeout
  # --- model context + answer budget -----------------------------------------
  max_tokens: 16384               # answer budget sent to the provider
  context_reserve: 4096           # tokens kept free below the window
  compact_force_ratio: 0.5        # force compaction when free space drops below
  summarizer_max_chars: 60000     # transcript chars handed to the summarizer
  context_budget: 262144          # fallback window when the model's is unknown
  context_keep_recent: 8          # turns kept verbatim by compaction
  context_retrieval_k: 3          # memory records retrieved per turn
  # --- repetition guard -------------------------------------------------------
  repeat_guard_enabled: true
  repeat_min_period: 20           # smallest repeated period detected (tokens)
  repeat_max_period: 240          # largest repeated period detected (tokens)
  repeat_limit: 4                 # repeats tolerated before the stream is stopped
  # --- HTTP server + SSE ------------------------------------------------------
  http_max_body_bytes: 8388608    # request body ceiling (8 MiB)
  feed_replay_max: 300            # events replayed to a re-attached page
  chat_stream_idle_secs: 900.0    # idle chat stream is closed after this
  think_flush_secs: 0.08          # live-thinking flush interval
  think_live_cap: 0               # 0 = no cap on live thinking
  # --- retention / stores -----------------------------------------------------
  events_keep: 200000             # event-log rows kept
  events_prune_secs: 900.0        # prune interval
  feed_events_max: 800            # events one /api/feed response may carry
  prune_batch: 50000              # rows deleted per prune transaction
  tool_event_max: 2000            # tool events kept per session
  thread_digest_max: 1500         # chars of a thread digest
  thread_line_max: 240            # chars of one line inside a digest
  thread_groups_max: 2000         # thread groups kept
  memory_core_max: 4000           # chars of the CORE memory block
  # --- editing ----------------------------------------------------------------
  fs_edit_max_edits: 50           # rows one fs.edit batch may carry
  fs_edit_stale_guard: true       # refuse an edit on a file changed since fs.read
  # --- skills / graph / jobs / teams / held-out gate --------------------------
  skill_max_zip_bytes: 20971520
  skill_max_unzip_bytes: 62914560
  skill_max_files: 500
  graph_orphan_days: 14.0
  job_retries: 1                  # 0 = never retry a job
  team_local_slots: 1             # 0 = no local slot held for the team
  require_heldout: true           # refuse a run without a held-out check
  tls_enabled: true               # serve over TLS unless LONGRUN_TLS=0

# ---- shell pool (2026-11-05) ------------------------------------------------
# The persistent terminal the agent and the RH Terminal panel share. Not a
# context budget, but the same rule applies: no literal in `tools/term.py`.
# Chain: LONGRUN_SHELL_* env -> this block -> the DEFAULTS in `context_limits.py`.
shell:
  max_shells: 8             # oldest idle shell is reaped beyond this
  idle_timeout_secs: 3600   # a shell idle this long is reaped
  backlog: 2000             # events kept per shell (cursor catch-up)

# ---- webhook intake (2026-11-06) --------------------------------------------
# External events (GitHub, CI, a script) become one-agent JOBS. The store with the
# hooks and their secrets lives OUTSIDE the repo: `<data home>/webhooks.json`.
# Chain: env -> this block -> the DEFAULTS in `context_limits.py` (read at import).
webhooks:
  max_hooks: 20                # refuse a new hook beyond this
  max_body_kb: 256             # a larger delivery is refused with 413
  deliveries_keep: 50          # deliveries kept per hook (ring)
  dedupe_window_secs: 600      # the same delivery id inside this window is a duplicate
  max_per_minute: 6            # deliveries accepted per hook per rolling minute
  payload_chars: 6000          # how much of the payload reaches the agent

# ---- thinking / reasoning budget (RH-15) ------------------------------------
# EVERY thinking limit lives here: this block is the source of truth, the WebUI
# writes only its diffs into the sparse overlay (Settings > Models > Thinking
# effort), and the code holds the same numbers as a fallback. Nothing about the
# model's thinking is a constant in Python any more.
#
# The chain is DEFAULTS (rllm.py) <- this file <- data/tools.overlay.yaml.
reasoning:
  enabled: false            # OPT-IN. With false nothing is sent, so the PROVIDER default
                            # applies. That default is NOT the deepest shape (measured
                            # 2026-11-03 with curl: z-ai/glm-5.3-flash 422-618 reasoning
                            # tokens with no field vs 2510-4855 with `effort: max`, and
                            # gemini-2.5-flash thinks 0 tokens). `max` is the top.
  effort: ""                # none|minimal|low|medium|high|xhigh|max; "" = leave alone
  format: auto              # provider dialect; auto reads it from the provider kind
  # The answer+thinking ENVELOPE of one completion. A thinking budget is clamped
  # strictly below it, so a small envelope SILENTLY caps the thinking: at 16384 the
  # `high` level (24000) was really sent as 15360. 32768 lets `high`/`xhigh` through.
  max_tokens: 32768
  # Thinking tokens, for the providers that take a NUMBER instead of a level name.
  # 32000 is the highest a provider accepts (OpenRouter rejects more), so `high`
  # and `xhigh` both sit at that ceiling on purpose.
  budgets:
    minimal: 2048
    low: 8192
    medium: 16384
    high: 24000
    xhigh: 32000
    max: 32000
  budget_floor: 1024        # the lowest a provider accepts (Anthropic)
  budget_ceiling: 32000     # the highest a provider accepts (OpenRouter cap)
  budget_reserve: 1024      # answer room kept strictly below `max_tokens`

# ---- verifier "apply-only-if-green" (JAG-131) -------------------------------
# Quando attivo, dopo OGNI fs.write/fs.edit l'harness esegue `command` nella
# sandbox: se NON passa, la modifica viene annullata (rollback) e il modello
# riceve l'errore.
# JAG-1 (operator, 2026-11-02): ON by default — the Harness panel shows it ticked
# and the goal verifier reuses the same command. With an EMPTY command it is a
# no-op, so enabling it changes nothing until a command is set; set one (e.g. the
# project tests) to make every edit prove itself.
verifier:
  enabled: true
  # "" = no per-edit verification. "auto" resolves the project's OWN test command
  # from its markers (pytest -> package.json `test` -> Makefile `test:`); a literal
  # command overrides. With no marker the check is SKIPPED, never a failed edit.
  # Per-edit verification is expensive: prefer `closeout: true`, which resolves
  # "auto" by itself and pays for the suite once per closed step.
  command: ""
  timeout_secs: 120         # timeout del check
  paths: []                 # se non vuoto, verifica solo i path che contengono uno di questi
  closeout: false           # F1: verify ONCE at closeout when the step changed the environment

# ---- goal verification (JAG-1) ----------------------------------------------
# A GOAL is not the todo list: closing every todo is the agent's CLAIM. The
# harness decides that claim INDEPENDENTLY and only then marks the goal done.
# L1 (acceptance) runs the `verifier.command` in the goal's workspace; L2
# (artefacts) requires every source a done step cites to exist on disk; L3
# (judge) asks a cheap model to judge the objective against the artefacts alone.
goal_verify:
  acceptance: true          # L1: run verifier.command when the plan looks complete
  judge: false              # L3: also ask a model to pass/fail the objective
  judge_model: ""           # empty = the subagent role chain

# ---- run budget (R3) ---------------------------------------------------------
# Hard ceiling on cumulative prompt+completion tokens for ONE run tree (the run
# plus every subagent it spawns). 0 = off (today's behaviour). Checked after each
# model call by the v2 loop; a breach ends the run with termination="budget".
budget:
  max_tokens_per_run: 0

# ---- best-of-N + rank (JAG-132) ---------------------------------------------
# Test-time compute: per uno step non banale campiona N candidati e sceglie il
# migliore con il ranker deterministico (prm.rank_text), invece del primo.
# JAG-1 (operator, 2026-11-02): ON by default (the Harness panel shows it ticked).
# `n: 1` keeps it a no-op until N is raised — or let `difficulty` scale N per task
# (easy_n/medium_n/hard_n below).
bestofn:
  enabled: true
  n: 1
  min_score: 0.0            # se il migliore resta sotto questa soglia -> nessuna scelta

# ---- difficulty / budget adattivo (JAG-134) ---------------------------------
# Compute-optimal test-time compute: stima la difficolta' del task (deterministica,
# dai segnali che l'harness gia' ha) e scala di conseguenza N (best-of-N) e i giri
# di continuazione (keepgoing_max). Con enabled: false tutto torna al budget fisso.
difficulty:
  enabled: true
  easy_n: 1                 # candidati best-of-N per task facile
  medium_n: 2
  hard_n: 3
  medium_at: 0.35           # punteggio >= -> "medium"
  hard_at: 0.65             # punteggio >= -> "hard"

# ---- self-evolving skills (JAG-133/135) -------------------------------------
# Se l'harness ripete la stessa sequenza di tool su run diversi, la impacchetta
# come skill. Stadio 1 = bozza; stadio 2 = synth + verify in sandbox + archive
# (solo se verde). min_len/min_count/max_len = soglie del miner.
selfevolve:
  # v656: min_len 2 -> 3 — una coppia di tool (fs.read + shell) è generica, non
  # una skill: i suoi draft dicevano all'operatore esattamente niente.
  min_len: 3                # lunghezza minima della sequenza (n. tool)
  min_count: 3              # su quante run diverse deve ripetersi
  max_len: 6                # lunghezza massima cercata
  # JAG-426: auto-generated skills are confined to skills/created/ (the built-in
  # skills/core library is immutable and can never be written by the miner).
  category: created         # skills/<category>/<name> at promotion time
  verify_timeout: 60        # timeout del check in sandbox
  # EV-13: evolve's CODE arm. A green pattern is also forged into a Matrix tool
  # (`learned_<slug>.run`) that replays the sequence; it stays only after its own
  # generated test and the sha-bound contract gate pass (removed otherwise).
  # `forge_per_run` bounds one evolve pass so it cannot flood src/Matrix.
  forge_on_evolve: true
  forge_per_run: 1
  # --- evolution gate (2026-11-04) -------------------------------------------
  # verify_repeats: each case is executed N times; a case passes on a strict
  # majority. 1 = today's behaviour. ParetoSaddler (2611.02079) needs 3.
  verify_repeats: 1
  # max_cost_ratio: an automatic promotion whose markdown is more than N x the
  # installed median is refused (the prompt pays for it on every turn). The
  # operator can still release it.
  max_cost_ratio: 2.0
  # smoke_set: also re-check the INSTALLED artifacts' case tables before a
  # promotion (composition safety). Off by default: it runs every stored case.
  smoke_set: false
  # retire_after_days: a forged Matrix tool never used within this window is
  # removable (`selfevolve.retire_unused`).
  retire_after_days: 14

# ---- loop detection by tool TYPE frequency (M5, upgrade plan) ---------------
# The v2 identical-action trap misses a model calling one tool type dozens of
# times with different args. Warn at `warn`, cap the run at `hard` (reusing the
# no_progress termination + a loop_capped event). `per_tool` overrides one
# type: the shell is the legitimate high-frequency case. enabled: false = off.
loop_detection:
  enabled: true
  window: 50
  warn: 30
  hard: 50
  per_tool:
    shell: {warn: 100, hard: 200}

# ---- tool registry -----------------------------------------------------------
tools:

  # arbitrary command execution — always sandboxed, approval-gated
  shell:
    enabled: true
    approval: required
    # read-only / non-mutating commands are auto-approved (still recorded)
    auto_approve:
      - "^ls(\\s|$)"
      - "^pwd$"
      - "^whoami$"
      - "^id(\\s|$)"
      - "^date(\\s|$)"
      - "^uname(\\s|$)"
      - "^hostname$"
      - "^cat(\\s|$)"
      - "^head(\\s|$)"
      - "^tail(\\s|$)"
      - "^wc(\\s|$)"
      - "^echo(\\s|$)"
      - "^printf(\\s|$)"
      - "^find(\\s|$)"
      - "^rg(\\s|$)"
      - "^grep(\\s|$)"
      - "^env$"
      - "^which(\\s|$)"
      # 2026-11-05: a background job's own controls carry no command, so their
      # subject IS the action (registry._subject). Polling a job must never wait
      # for a human; stopping one only kills a process the agent started.
      - "^status$"
      - "^stop$"
    # hard blocks — never executed, even with approval
    deny:
      - "rm\\s+-rf\\s+/(\\s|$)"
      - "\\bmkfs(\\s|$)"
      - "\\bdd\\s+if=/dev/(zero|random)"
      - ":\\s*\\(\\s*\\)\\s*\\{"
      # 2026-11-04 (operator: "remove that command from hard denial i need to
      # shutdown the machines"): `\b(shutdown|reboot|poweroff)\b` was REMOVED. A
      # hard deny is absolute — approvals.mode=full never lifts it — so the
      # requirement could not be met any other way. Powering off is now an ordinary
      # command; re-add the pattern here to make it impossible again (the agent
      # would then only see "BLOCKED" with the rule named).
      - ">\\s*/dev/(sd|nvme|mmcblk)"
      - "LONGRUN_TOKEN"
      - "grep[^\\n]*\\.env"
      - "curl[^\\n]*127\\.0\\.0\\.1[^\\n]*/api/(jobs|agents|teams|longrun-agent)"
      - "curl[^\\n]*localhost[^\\n]*/api/(jobs|agents|teams|longrun-agent)"

  # read a file (host-side, constrained to allowed roots)
  fs.read:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # write a file (host-side, constrained to the allowed roots; JAG-59: the repo
  # root so the agent can create/edit the DGX repos it works on)
  # JAG-61: also allow the Repositories parent — "." resolves to REPO
  # (longrun/), so without this the agent cannot write to sibling repos like
  # tododemo (it would fall back to printf-through-shell).
  fs.write:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"

  # surgical edit: exact search/replace inside a file (safer than rewriting
  # the whole file with fs.write); same roots as fs.write
  fs.edit:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"

  # git — read-only subcommands auto-approved, mutating ones need approval
  git:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"
    auto_approve:
      - "^status(\\s|$)"
      - "^log(\\s|$)"
      - "^diff(\\s|$)"
      - "^show(\\s|$)"
      - "^branch(\\s|$)"
      - "^remote(\\s|$)"
      - "^rev-parse(\\s|$)"
      - "^describe(\\s|$)"
      - "^ls-files(\\s|$)"
      - "^tag(\\s|$)"
    # 2026-11-05 (operator: "Git push in full does not ask for approval"): a
    # matcher here reaches a human even when approvals.mode is FULL — approving the
    # card still runs the command, so this is a brake, not a block. Managed from
    # Settings > Permissions (the "always ask" list).
    always_ask:
      - "^push(\\s|$)"
    # 2026-11-05 (operator: "Yes agent may push"): `^push(\s|$)` was REMOVED from
    # this deny list. Push is now an ordinary mutating subcommand, so it follows the
    # tool's `approval` policy (the shipped default is `required`; an overlay that
    # relaxes it to `auto` makes push silent). Authentication is NOT provided by the
    # Keys panel: git reads `~/.git-credentials` via `credential.helper=store`.
    deny: []

  # HTTP fetch from the harness process (needs net, so not inside the sandbox)
  http:
    enabled: true
    approval: required
    auto_approve: []
    allow_hosts:
      - "127.0.0.1"
      - "localhost"

  # lightweight page fetcher/HTML->text (NOT a headless browser). Enabled with
  # approval required; an empty allow_hosts means public internet only, enforced
  # by the SSRF guard (private/loopback/link-local blocked, same model as `web`).
  # A non-empty allow_hosts restricts to that strict list instead.
  browser:
    enabled: true
    approval: required
    auto_approve: []
    allow_hosts: []

  # public-internet search + fetch (JAG-83): Tavily/Brave when a key is present
  # (read from ~/.hermes/.env), else keyless DuckDuckGo; pages via r.jina.ai or
  # direct HTML->text. Read-only, SSRF-guarded (public hosts only).
  web:
    enabled: true
    approval: auto
    auto_approve: []

  # unified diff of two files or two texts (stdlib difflib) — read-only
  diff:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # self-knowledge: repo/config paths, skill/MCP install recipe, systemd state
  self:
    enabled: true
    approval: auto

  # recover sessions left with an unanswered user turn by a hard restart/crash
  # (JAG-263): closes the orphan + releases 'doing' todos. Safe + idempotent, so
  # the agent may call it on its own when a session looks stuck.
  reconcile:
    enabled: true
    approval: auto

  # skills registry (v0.7.1): list/search/audit/read agent skills from
  # skills/<cat>/<name>/SKILL.md (symlinked skill distribution). Read-only, safe.
  skills:
    enabled: true
    approval: auto

  # codebase index (JAG-400): search the CURRENT workspace's code/docs. Scoped to
  # the workspace PATH (like project rules), never global. The per-workspace DB
  # lives in the app data dir, never in the repo.
  index:
    enabled: true
    approval: auto

  # knowledge base (JAG-401): GLOBAL notebooks of sources (URLs/files/text), plus
  # web discovery. Separate store from the codebase index.
  knowledge:
    enabled: true
    approval: auto

  # session inspection (JAG-350): let the coordinator/Master READ other sessions'
  # full transcripts (messages + tool calls + harness injections) to understand
  # WHY a teammate is failing and help it. Read-only, safe.
  sessions:
    enabled: true
    approval: auto

  # workspace re-rooting: an orchestrator links a folder to itself or to its
  # whole org subtree (all levels). The agent record and the session's runtime
  # workspace are written together; a caller may only target itself or a
  # subordinate (the harness supervisor may target anyone).
  # JAG-1: the harness PROMPTS agents to set their workspace per task, so the
  # default is `required` — the operator approves the folder (FULL/auto mode is
  # the standing opt-out). Change to `auto` to let agents re-root themselves and
  # their team unattended.
  workspace:
    enabled: true
    approval: required

  # thread ledger (JAG-431j): THIS session's chat GROUPS in chronological order (task +
  # free), so the agent can recall a whole long run after many compactions, and TITLE
  # the free groups from their real content. The ledger is written by the harness
  # before compaction can touch the transcript; the tool only reads it (+ a title
  # string). Read-only/safe.
  chapters:
    enabled: true
    approval: auto

  # context meter + manual compaction (JAG-431r2): the agent can check how
  # close the next turn is to the auto-compact trigger and run a manual
  # compaction to free headroom before a large tool call or paste.
  context:
    enabled: true
    approval: auto

  # agent memory (JAG-73): ordinary store/recall is automatic; destructive
  # memory operations below override this namespace default.
  memory:
    enabled: true
    approval: auto

  # Replacing/clearing core memory or permanently deleting stored records requires
  # approval in normal mode (global approvals.mode=full bypasses all such gates).
  # These rows set `approval` ONLY: `enabled` belongs to the namespace, so
  # `memory: {enabled: false}` really switches memory off (v718 — the four rows
  # used to pin `enabled: true`, and the namespace toggle left them running).
  memory.set_core:
    approval: required
  memory.clear_core:
    approval: required
  memory.forget:
    approval: required
  memory.purge:
    approval: required

  improve:
    enabled: true
    approval: auto

  matrix:
    enabled: true
    approval: auto

  # Destructive Matrix actions override the namespace's automatic policy in
  # normal mode; global approvals.mode=full remains the operator's opt-out.
  matrix.git_reset:
    enabled: true
    approval: required
  matrix.checkpoint_rollback:
    enabled: true
    approval: required
  matrix.clean_trash:
    enabled: true
    approval: required
  matrix.webui_reset:
    enabled: true
    approval: required
  matrix.remove:
    enabled: true
    approval: required

  # ---- JAG-426: baseline tools every standard harness ships ------------------
  # Native Python execution (previously only reachable via the pmcp MCP client,
  # so a host without pmcp had NO way to run a snippet). Arbitrary code = the
  # same approval class as `shell`.
  python:
    enabled: true
    approval: required

  # Process list / terminate (Linux /proc, stdlib only). Listing is read-only and
  # auto-approved; terminating needs approval. The tool itself refuses pid<=1 and
  # its own pid.
  process:
    enabled: true
    approval: required
    auto_approve:
      - "^list$"

  # Structured file listing (read-only), inside the same roots as fs.read.
  glob:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # Ask the OPERATOR to decide (human.ask). This tool is the ONLY source of a
  # HUMAN IN THE LOOP card: the turn raises it because the AGENT asked, never
  # because the harness decided to. Behind an approval prompt it would be
  # unreachable exactly when it is needed, so it is auto-approved.
  human:
    enabled: true
    approval: auto

  # ---- JAG-535/538: exclusive built-in automation tools (VEO) ---------------
  # Dual-permission gated: callable ONLY when enabled here AND the calling
  # session is `longrunAgent` or has `allow_longrun_agent: true`.
  # One namespace per object; each tool is exactly `namespace.tool`.
  agent:      { enabled: true, approval: auto }   # agent.create|update|get|list|delete|prompt_*
  team:       { enabled: true, approval: auto }   # team.create|update|get|list|delete|member_*
  job:        { enabled: true, approval: auto }   # job.create|dispatch|get|list|delete
  routine:    { enabled: true, approval: auto }   # routine.create|update|get|list|delete
  session:    { enabled: true, approval: auto }   # session.create|rename|list|delete
  webui:      { enabled: true, approval: auto }   # webui.inspect|configure
  provider:   { enabled: true, approval: auto }   # provider.upsert|remove|add_model|remove_model|set_default|reload
  mcp:        { enabled: true, approval: auto }   # mcp.upsert|remove|test|reload
  skill:      { enabled: true, approval: auto }   # skill.remove
  kb:         { enabled: true, approval: auto }   # kb.notebook_*|source_*|reembed

  # external MCP tools appear as <client>__<tool> (config/mcp_clients.yaml);
  # default policy is approval=required. Read-only pmcp gateway probes are
  # auto-approved so the agent can observe real MCP output.
  pmcp__gateway.health:
    enabled: true
    approval: auto
  pmcp__gateway.config_status:
    enabled: true
    approval: auto
  pmcp__gateway.tasks_list:
    enabled: true
    approval: auto
  pmcp__gateway.catalog_search:
    enabled: true
    approval: auto
  pmcp__gateway.describe:
    enabled: true
    approval: auto
  pmcp__gateway.invoke:
    enabled: true
    approval: required

  # 2026-11-05 (operator: "why those tools are cabled off?"): external MCP tools
  # are OPT-IN (JAG-80) — a discovered tool that is not named here has
  # `enabled: false`, which is why `time__get_time_ago` showed up as disabled in
  # Settings → Tools with no explanation. It is a read-only clock helper; list it
  # explicitly so the three time tools are all on.
  time__get_time_ago:
    enabled: true
    approval: required

  # JAG-125: Python snippet runner (MCP client `python_sandbox`). Pyodide/WASM:
  # no host filesystem, no shell, no network — safe to auto-approve so the model
  # can actually compute/execute snippets instead of hunting the pmcp catalog.
  python_sandbox__run_python_code:
    enabled: true
    approval: auto
