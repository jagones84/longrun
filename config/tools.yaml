# Longrun tool registry — v0.2
# Declarative allowlist + approval policy. Edit and POST /api/tools to reload
# (or just restart the server). Unknown tools are denied; destructive subtools
# override namespace defaults in normal mode. Global approvals.mode=full is an
# explicit opt-out that bypasses per-tool approval gates.
version: "0.2"

# ---- real sandbox (bubblewrap / nsjail / container) --------------------------
sandbox:
  # auto | docker | bwrap | nsjail | none
  #   auto  -> first working backend of: docker, bwrap, nsjail
  #   none  -> run on the host (NOT sandboxed; marked `sandboxed: false`)
  #
  # JAG-59: "tutto deve vivere sul DGX" — the shell tool must use the real DGX
  # environment (JDK/Gradle/Android SDK/adb + the repo), which an alpine
  # container cannot provide. So we run on the host. Mutating commands are
  # still approval-gated and checked against the `deny` list below.
  backend: none
  image: alpine:latest          # container image for the docker backend
  timeout_secs: 900             # per-command wall clock (APK builds take minutes)
  network: true                 # host network (docker backend would use --network host)
  memory_mb: 256
  pids_limit: 128
  cpus: "1.0"
  workspace: sandbox            # per-run scratch dir bind-mounted as /work,
                                # RELATIVE to the data home (never the checkout)

# ---- approvals ---------------------------------------------------------------
approvals:
  timeout_secs: 300             # how long a run waits for a human decision
  # JAG-510 — DANGEROUS, leave it false. When true it unlocks writes into the
  # immutable Nucleus (`src/longrun/`, `webui/`, `config/`, `deploy/`, `tests/`,
  # `docs/`, `.longrun/`, `Global_rules.md` / `Project_rules.md`, `AGENTS.md`, ...) for EVERY tool: the shell
  # write-target gate, `fs.write`/`fs.edit` and the tamper-restore all stand down,
  # so the agent can rewrite the harness mid-run. It is the only kill-switch for
  # the Nucleus and it is enabled exclusively from the checkbox marked DANGEROUS
  # in Settings > Tools & approvals — never by `approvals.mode: full`.
  allow_nucleus_write: false
  # JAG-451: approval policy BY CATEGORY — everything the harness can emit on its
  # own. auto = apply/run without asking (still recorded in the audit ledger);
  # required = raise an approval request (you decide); denied = never emitted.
  # Editable in Settings > Tools & approvals.
  kinds:
    memory: auto        # distilled lessons auto-written to data/memory
    proposals: required # agent-proposed rule/skill changes
    skills: required    # self-generated skill drafts (mined -> promoted)
    subagent: auto      # spawning a delegated subagent

# ---- runtime / long-horizon (JAG-129) ---------------------------------------
# Controlla il loop di completamento: l'harness non lascia chiudere il turno
# finche' la TASK LIST ha passi aperti. Editabile anche dalla WebUI (Config).
runtime:
  keepgoing_max: 8          # giri di continuazione prima dello stop 'budget'
  no_progress_rounds: 2     # giri senza progresso prima dello stop 'no_progress'
  max_wall_secs: 3600       # tetto di tempo per run
  subagent_max_depth: 2     # profondita' massima della matrioska
  # JAG-533: how many TOOL calls of one `batch` action the agent may run at the
  # same time (0 or negative = 1). The `batch` action lets the model issue
  # several INDEPENDENT calls in one turn instead of one per turn. The matching
  # cap for parallel SUBAGENTS is `max_parallel` in config/subagents.yaml.
  max_parallel_tools: 4

# ---- verifier "apply-only-if-green" (JAG-131) -------------------------------
# Quando attivo, dopo OGNI fs.write/fs.edit l'harness esegue `command` nella
# sandbox: se NON passa, la modifica viene annullata (rollback) e il modello
# riceve l'errore. Default DISATTIVO (command vuoto) per non sorprendere.
# Esempio per un repo Python:  command: "python3 -m pytest -q"
verifier:
  enabled: false
  command: ""               # comando di verifica (vuoto = nessuna verifica)
  timeout_secs: 120         # timeout del check
  paths: []                 # se non vuoto, verifica solo i path che contengono uno di questi

# ---- best-of-N + rank (JAG-132) ---------------------------------------------
# Test-time compute: per uno step non banale campiona N candidati e sceglie il
# migliore con il ranker deterministico (prm.rank_text), invece del primo.
# n: 1 = disattivato (comportamento attuale, nessun overhead).
bestofn:
  enabled: false
  n: 1
  min_score: 0.0            # se il migliore resta sotto questa soglia -> nessuna scelta

# ---- difficulty / budget adattivo (JAG-134) ---------------------------------
# Compute-optimal test-time compute: stima la difficolta' del task (deterministica,
# dai segnali che l'harness gia' ha) e scala di conseguenza N (best-of-N) e i giri
# di continuazione (keepgoing_max). Con enabled: false tutto torna al budget fisso.
difficulty:
  enabled: true
  easy_n: 1                 # candidati best-of-N per task facile
  medium_n: 2
  hard_n: 3
  medium_at: 0.35           # punteggio >= -> "medium"
  hard_at: 0.65             # punteggio >= -> "hard"

# ---- self-evolving skills (JAG-133/135) -------------------------------------
# Se l'harness ripete la stessa sequenza di tool su run diversi, la impacchetta
# come skill. Stadio 1 = bozza; stadio 2 = synth + verify in sandbox + archive
# (solo se verde). min_len/min_count/max_len = soglie del miner.
selfevolve:
  min_len: 2                # lunghezza minima della sequenza (n. tool)
  min_count: 3              # su quante run diverse deve ripetersi
  max_len: 6                # lunghezza massima cercata
  # JAG-426: auto-generated skills are confined to skills/created/ (the built-in
  # skills/core library is immutable and can never be written by the miner).
  category: created         # skills/<category>/<name> at promotion time
  verify_timeout: 60        # timeout del check in sandbox

# ---- tool registry -----------------------------------------------------------
tools:

  # arbitrary command execution — always sandboxed, approval-gated
  shell:
    enabled: true
    approval: required
    # read-only / non-mutating commands are auto-approved (still recorded)
    auto_approve:
      - "^ls(\\s|$)"
      - "^pwd$"
      - "^whoami$"
      - "^id(\\s|$)"
      - "^date(\\s|$)"
      - "^uname(\\s|$)"
      - "^hostname$"
      - "^cat(\\s|$)"
      - "^head(\\s|$)"
      - "^tail(\\s|$)"
      - "^wc(\\s|$)"
      - "^echo(\\s|$)"
      - "^printf(\\s|$)"
      - "^find(\\s|$)"
      - "^rg(\\s|$)"
      - "^grep(\\s|$)"
      - "^env$"
      - "^which(\\s|$)"
    # hard blocks — never executed, even with approval
    deny:
      - "rm\\s+-rf\\s+/(\\s|$)"
      - "\\bmkfs(\\s|$)"
      - "\\bdd\\s+if=/dev/(zero|random)"
      - ":\\s*\\(\\s*\\)\\s*\\{"
      - "\\b(shutdown|reboot|poweroff)\\b"
      - ">\\s*/dev/(sd|nvme|mmcblk)"

  # read a file (host-side, constrained to allowed roots)
  fs.read:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # write a file (host-side, constrained to the allowed roots; JAG-59: the repo
  # root so the agent can create/edit the DGX repos it works on)
  # JAG-61: also allow the Repositories parent — "." resolves to REPO
  # (longrun/), so without this the agent cannot write to sibling repos like
  # tododemo (it would fall back to printf-through-shell).
  fs.write:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"

  # surgical edit: exact search/replace inside a file (safer than rewriting
  # the whole file with fs.write); same roots as fs.write
  fs.edit:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"

  # git — read-only subcommands auto-approved, mutating ones need approval
  git:
    enabled: true
    approval: required
    roots:
      - "."
      - "/home/jagones/Repositories"
    auto_approve:
      - "^status(\\s|$)"
      - "^log(\\s|$)"
      - "^diff(\\s|$)"
      - "^show(\\s|$)"
      - "^branch(\\s|$)"
      - "^remote(\\s|$)"
      - "^rev-parse(\\s|$)"
      - "^describe(\\s|$)"
      - "^ls-files(\\s|$)"
      - "^tag(\\s|$)"
    deny:
      - "^push(\\s|$)"

  # HTTP fetch from the harness process (needs net, so not inside the sandbox)
  http:
    enabled: true
    approval: required
    auto_approve: []
    allow_hosts:
      - "127.0.0.1"
      - "localhost"

  # lightweight page fetcher/HTML->text (NOT a headless browser); off by default
  browser:
    enabled: false
    approval: required
    auto_approve: []
    allow_hosts: []

  # public-internet search + fetch (JAG-83): Tavily/Brave when a key is present
  # (read from ~/.hermes/.env), else keyless DuckDuckGo; pages via r.jina.ai or
  # direct HTML->text. Read-only, SSRF-guarded (public hosts only).
  web:
    enabled: true
    approval: auto
    auto_approve: []

  # unified diff of two files or two texts (stdlib difflib) — read-only
  diff:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # self-knowledge: repo/config paths, skill/MCP install recipe, systemd state
  self:
    enabled: true
    approval: auto

  # recover sessions left with an unanswered user turn by a hard restart/crash
  # (JAG-263): closes the orphan + releases 'doing' todos. Safe + idempotent, so
  # the agent may call it on its own when a session looks stuck.
  reconcile:
    enabled: true
    approval: auto

  # skills registry (v0.7.1): list/search/audit/read agent skills from
  # skills/<cat>/<name>/SKILL.md (symlinked skill distribution). Read-only, safe.
  skills:
    enabled: true
    approval: auto

  # codebase index (JAG-400): search the CURRENT workspace's code/docs. Scoped to
  # the workspace PATH (like project rules), never global. The per-workspace DB
  # lives in the app data dir, never in the repo.
  index:
    enabled: true
    approval: auto

  # knowledge base (JAG-401): GLOBAL notebooks of sources (URLs/files/text), plus
  # web discovery. Separate store from the codebase index.
  knowledge:
    enabled: true
    approval: auto

  # session inspection (JAG-350): let the coordinator/Master READ other sessions'
  # full transcripts (messages + tool calls + harness injections) to understand
  # WHY a teammate is failing and help it. Read-only, safe.
  sessions:
    enabled: true
    approval: auto

  # thread ledger (JAG-431j): THIS session's chat GROUPS in chronological order (task +
  # free), so the agent can recall a whole long run after many compactions, and TITLE
  # the free groups from their real content. The ledger is written by the harness
  # before compaction can touch the transcript; the tool only reads it (+ a title
  # string). Read-only/safe.
  chapters:
    enabled: true
    approval: auto

  # context meter + manual compaction (JAG-431r2): the agent can check how
  # close the next turn is to the auto-compact trigger and run a manual
  # compaction to free headroom before a large tool call or paste.
  context:
    enabled: true
    approval: auto

  # agent memory (JAG-73): ordinary store/recall is automatic; destructive
  # memory operations below override this namespace default.
  memory:
    enabled: true
    approval: auto

  # Replacing/clearing core memory or permanently deleting stored records requires
  # approval in normal mode (global approvals.mode=full bypasses all such gates).
  memory.set_core:
    enabled: true
    approval: required
  memory.clear_core:
    enabled: true
    approval: required
  memory.forget:
    enabled: true
    approval: required
  memory.purge:
    enabled: true
    approval: required

  improve:
    enabled: true
    approval: auto

  matrix:
    enabled: true
    approval: auto

  # Destructive Matrix actions override the namespace's automatic policy in
  # normal mode; global approvals.mode=full remains the operator's opt-out.
  matrix.git_reset:
    enabled: true
    approval: required
  matrix.checkpoint_rollback:
    enabled: true
    approval: required
  matrix.clean_trash:
    enabled: true
    approval: required
  matrix.webui_reset:
    enabled: true
    approval: required
  matrix.remove:
    enabled: true
    approval: required

  # ---- JAG-426: baseline tools every standard harness ships ------------------
  # Native Python execution (previously only reachable via the pmcp MCP client,
  # so a host without pmcp had NO way to run a snippet). Arbitrary code = the
  # same approval class as `shell`.
  python:
    enabled: true
    approval: required

  # Process list / terminate (Linux /proc, stdlib only). Listing is read-only and
  # auto-approved; terminating needs approval. The tool itself refuses pid<=1 and
  # its own pid.
  process:
    enabled: true
    approval: required
    auto_approve:
      - "^list$"

  # Structured file listing (read-only), inside the same roots as fs.read.
  glob:
    enabled: true
    approval: auto
    roots:
      - "."
      - "/home/jagones/Repositories"

  # external MCP tools appear as <client>__<tool> (config/mcp_clients.yaml);
  # default policy is approval=required. Read-only pmcp gateway probes are
  # auto-approved so the agent can observe real MCP output.
  pmcp__gateway.health:
    enabled: true
    approval: auto
  pmcp__gateway.config_status:
    enabled: true
    approval: auto
  pmcp__gateway.tasks_list:
    enabled: true
    approval: auto
  pmcp__gateway.catalog_search:
    enabled: true
    approval: auto
  pmcp__gateway.describe:
    enabled: true
    approval: auto
  pmcp__gateway.invoke:
    enabled: true
    approval: required

  # JAG-125: Python snippet runner (MCP client `python_sandbox`). Pyodide/WASM:
  # no host filesystem, no shell, no network — safe to auto-approve so the model
  # can actually compute/execute snippets instead of hunting the pmcp catalog.
  python_sandbox__run_python_code:
    enabled: true
    approval: auto
