# Longrun providers — every LLM the harness can talk to (JAG-71).
#
# ONE place that lists providers + the models each one exposes, so the mobile app
# can pick any of them and the harness routes the request to the right endpoint.
# NO secret ever lives here: a provider references its key by ENV VAR name, and
# the keys are read from a gitignored .env (see `env_files` below and .gitignore).
#
# Model references (`model` on the API) use `<provider_id>:<model_id>`, e.g.
#   dgx:glm-5.3-flash-iq2
#   win:qwen-3.8-27b-abliterated-q4
#   openrouter:z-ai/glm-5.3-flash
#   deepseek:deepseek-reasoner
# A bare model id (no known provider prefix) is resolved against every provider,
# local first, so existing configs keep working.
version: "1"

# Keys are loaded from these files at startup (first hit wins, no overwrite):
#   $LONGRUN_ENV_FILE, <repo>/.env, ~/.hermes/.env
env_files:
  - .env
  - ~/.hermes/.env

# The model a bare/absent request falls back to. A GENERAL cloud model, never a
# local one: the OpenRouter auto-router picks the best general model per request.
# The user's own choice (Settings ▸ Models ▸ ★) persists in providers.local.yaml
# and always wins over this shipped default.
default: openrouter:openrouter/auto

providers:
  # ---- local: llama.cpp router on the DGX Spark -----------------------------
  - id: dgx
    name: Llama.cpp (DGX Spark)
    kind: llamacpp
    base_url: http://127.0.0.1:8080/v1
    local: true
    models:
      - {id: qwen-3.8-27b-uncensored-q8, context_length: 262144, vision: true}
      - {id: qwen-3.8-27b-uncensored-q4, context_length: 262144, vision: true}
      - {id: glm-5.3-flash-iq2, context_length: 262144, vision: true}
      - {id: deepseek-v4-flash-uncensored-q2-0731, context_length: 262144}
      - {id: nex-n25-mini-uncensored-q8, context_length: 262144, vision: true}
      - {id: qwen-3.8-flash-next-iq3, context_length: 131072, vision: true}
      - {id: qwen-3.8-flash-next-uncensored-iq3, context_length: 131072, vision: true}

  # ---- local: llama.cpp on the Windows PC (Tailscale) -----------------------
  - id: win
    name: Llama.cpp (Windows PC)
    kind: llamacpp
    base_url: http://100.76.251.9:8080/v1
    local: true
    models:
      - {id: qwen-3.8-27b-abliterated-q4}
      - {id: qwen-3.8-27b-abliterated-q3, vision: true}
      - {id: qwen3.6-35b-a3b-uncensored-iq4xs, context_length: 96000, vision: true}
      - {id: nex-n2.5-mini-uncensored-iq4xs, context_length: 131072, vision: true}
      - {id: deepseek-r1-distill-qwen-32b-abl-iq2m}
      - {id: muse-glimmer-30b-abliterated-q3, vision: true}
      - {id: gemma-4-26b-a4b, vision: true}
      - {id: gpt-oss-20b}

  # ---- local: vLLM ----------------------------------------------------------
  - id: vllm
    name: vLLM (DGX)
    kind: openai
    base_url: http://127.0.0.1:8000/v1
    local: true
    api_key_env: VLLM_API_KEY
    models:
      - {id: deepseek-v4-flash-0731-exl3-k2}

  # ---- OpenRouter (cloud) ---------------------------------------------------
  - id: openrouter
    name: OpenRouter
    kind: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      # GLM flash family (requested)
      - {id: "~z-ai/glm-flash-latest"}
      - {id: "z-ai/glm-5.3-flash"}
      - {id: "z-ai/glm-5.3-flashx"}
      - {id: "z-ai/glm-5.3-flash:batch"}
      - {id: "~z-ai/glm-latest"}
      - {id: "z-ai/glm-5.3"}
      # Meta contributor fallback for the subagent role (requested)
      - {id: "meta/muse-spark-1.3-contributor"}
      # DeepSeek flash / pro family (requested)
      - {id: "~deepseek/deepseek-flash-latest"}
      - {id: "~deepseek/deepseek-v4-flash-latest"}
      - {id: "deepseek/deepseek-v4.1-flash"}
      - {id: "deepseek/deepseek-v4.1-flash:batch"}
      - {id: "deepseek/deepseek-v4-flash-0731"}
      - {id: "deepseek/deepseek-v4-pro-0813"}
      - {id: "~deepseek/deepseek-pro-latest"}
      # convenient router aliases
      - {id: "openrouter/auto"}
      - {id: "openrouter/auto-beta"}

  # ---- DeepSeek, original API (requested) -----------------------------------
  - id: deepseek
    name: DeepSeek (original API)
    kind: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    models:
      - {id: deepseek-chat}
      - {id: deepseek-reasoner}

  # ---- cloud DEFAULTS shipped with the repo (override in providers.local.yaml)
  # These are the best-known hosted providers. The repo lists them + their
  # flagship models so a fresh clone is useful out of the box; the key is only
  # ever referenced by NAME (set it in Settings -> Keys, stored in .env).
  - id: openai
    name: OpenAI
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models:
      - {id: gpt-6-astra, context_length: 1050000}
      - {id: gpt-5.6-sol, context_length: 1050000}
      - {id: gpt-5.6-terra, context_length: 1050000}
      - {id: gpt-5.6-luna, context_length: 1050000}

  # Anthropic via its official OpenAI SDK compatibility layer
  # (base_url https://api.anthropic.com/v1/, Bearer auth).
  - id: anthropic
    name: Anthropic (Claude)
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    models:
      - {id: claude-fable-5.1, context_length: 1000000}
      - {id: claude-fable-5, context_length: 1000000}
      - {id: claude-opus-4-8, context_length: 1000000}
      - {id: claude-sonnet-5, context_length: 1000000}
      - {id: claude-haiku-4-5, context_length: 200000}

  # Google Gemini via its official OpenAI-compatible endpoint.
  - id: google
    name: Google (Gemini)
    kind: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    models:
      - {id: gemini-3.8-flash, context_length: 1048576}
      - {id: gemini-3.1-pro-preview, context_length: 1048576}
      - {id: gemini-3.1-flash-lite, context_length: 1048576}

  # ---- EMBEDDING-ONLY providers (JAG-403k) ---------------------------------
  # OpenAI-compatible `/embeddings` endpoints referenced by the embedding
  # catalogue (config/embedding.yaml, `<provider>:<model>` refs). They carry NO
  # chat models and are flagged `embed_only` so they never clutter the chat
  # model picker — `providers.resolve()` still finds them for embeddings.
  - id: cohere
    name: Cohere (embeddings)
    kind: openai
    base_url: https://api.cohere.ai/compatibility/v1
    api_key_env: COHERE_API_KEY
    embed_only: true
    models: []
  - id: voyage
    name: Voyage AI (embeddings)
    kind: openai
    base_url: https://api.voyageai.com/v1
    api_key_env: VOYAGE_API_KEY
    embed_only: true
    models: []
  - id: jina
    name: Jina AI (embeddings)
    kind: openai
    base_url: https://api.jina.ai/v1
    api_key_env: JINA_API_KEY
    embed_only: true
    models: []
