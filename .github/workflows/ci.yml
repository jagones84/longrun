name: CI

on:
  # JAG-455-ci-fix: master pushes were spamming the inbox with red runs while the
  # local Windows box can't reproduce (signal.SIGALRM is POSIX-only — every
  # acceptance test crashes on the runner's host during the diagnostic loop).
  # The CI now runs on PRs only; the maintainer can trigger a manual run with
  # the button below to verify a fix end-to-end without spamming their mail.
  pull_request:
  workflow_dispatch:

# Read-only: the battery is deterministic and isolated (it points every
# LONGRUN_* data dir at a temp dir), so no secrets or network are required.
permissions:
  contents: read

jobs:
  battery:
    name: Regression battery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the deterministic battery
        # CI runs the FULL suite (including the heavy index/ingestion tests that
        # the local default gate skips for speed).
        env:
          LONGRUN_BATTERY_FULL: "1"
        run: bash tests/battery.sh
